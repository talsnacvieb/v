  <style>
    :root{--bg:#07110f;--panel:#0d1b17;--green:#0d5b43;--green2:#16845d;--lime:#c5e7a0;--cream:#f3f0e8;--muted:#a7b4ac;--line:rgba(232,242,233,.13);--msg:#0084ff;--msg-hover:#1a94ff}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--cream);font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");z-index:5}
    a{color:inherit;text-decoration:none}
    .wrap{width:min(1160px,calc(100% - 48px));margin:auto}
    header{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:11px;font-family:Manrope,sans-serif;font-weight:800;letter-spacing:.16em;font-size:13px}
    .brand-mark{width:30px;height:30px;border:1px solid rgba(197,231,160,.65);border-radius:50%;display:grid;place-items:center;color:var(--lime);font-size:14px}
    .top-note{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
    .hero{min-height:690px;display:grid;grid-template-columns:1.03fr .97fr;align-items:center;gap:34px;padding:72px 0 76px;position:relative}
    .hero-copy{position:relative;z-index:2;padding:10px 0}

    h1{font-family:Manrope,sans-serif;font-size:clamp(48px,6.2vw,78px);line-height:.99;letter-spacing:-.065em;margin:0 0 24px;font-weight:700;max-width:630px}
    h1 span{display:block;color:var(--lime);font-weight:500}

    .benefits{display:grid;gap:15px;margin:0 0 34px;padding:0;list-style:none}
    .benefits li{display:flex;align-items:center;gap:13px;color:#e6e9e2;font-size:14px}
    .check{width:22px;height:22px;display:grid;place-items:center;border:1px solid rgba(197,231,160,.45);border-radius:50%;color:var(--lime);font-size:11px;flex:0 0 auto}

    .cta-group{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:520px}
    .cta{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:62px;padding:0 22px;border-radius:4px;font-size:12px;font-weight:800;letter-spacing:.13em;transition:transform .2s,background .2s,box-shadow .2s;box-shadow:0 9px 28px rgba(0,0,0,.22);text-align:center;line-height:1.1}
    .cta:hover{transform:translateY(-2px)}
    .cta-primary{background:var(--lime);color:#102018}
    .cta-primary:hover{background:#d5f2b5}
    .cta-messenger{background:var(--msg);color:#fff}
    .cta-messenger:hover{background:var(--msg-hover);box-shadow:0 12px 32px rgba(0,132,255,.35)}
    .cta .arrow{font-size:19px;font-weight:400}
    .cta-icon{width:22px;height:22px;flex:0 0 auto}

    .visual{position:relative;min-height:545px;display:grid;place-items:center;isolation:isolate}
    .orb{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(23,120,82,.27),rgba(7,17,15,0) 68%);filter:blur(12px);z-index:-2}
    .halo{position:absolute;width:390px;height:390px;border:1px solid rgba(197,231,160,.11);border-radius:50%;transform:rotate(-18deg) scaleY(.72);z-index:-1}
    .halo:before,.halo:after{content:"";position:absolute;border:1px solid rgba(197,231,160,.09);border-radius:50%;inset:25px}
    .halo:after{inset:55px}
    .phone-wrap{position:relative;transform:rotate(-5deg);filter:drop-shadow(28px 32px 36px rgba(0,0,0,.48));}
    .phone{width:278px;height:548px;padding:9px;border-radius:39px;background:linear-gradient(135deg,#7b827c,#171e1b 18%,#303833 55%,#0a0e0c);border:1px solid #69716b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);position:relative}
    .phone:after{content:"";position:absolute;right:-3px;top:112px;width:3px;height:65px;background:#505951;border-radius:0 3px 3px 0}
    .screen{height:100%;border-radius:31px;overflow:hidden;background:#071a13;position:relative;border:1px solid #020604}
    .screen:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,rgba(255,255,255,.06),transparent 30%,rgba(0,0,0,.18));pointer-events:none;z-index:3}
    .island{position:absolute;top:8px;left:50%;transform:translateX(-50%);height:18px;width:78px;border-radius:20px;background:#020403;z-index:5}
    .appbar{height:58px;padding:25px 14px 0;display:flex;align-items:center;justify-content:space-between;font-size:8px;letter-spacing:.12em;color:#dce7d9}
    .appbrand{font-weight:800;letter-spacing:.18em;font-size:9px}
    .avatar{width:18px;height:18px;border-radius:50%;border:1px solid #8ab994;display:grid;place-items:center;font-size:8px;color:#c5e7a0}
    .table-area{margin:14px 8px 0;height:248px;border-radius:48% / 38%;background:radial-gradient(ellipse at 50% 45%,#176849 0,#0b4b35 54%,#06271d 73%,#101c16 74%,#060b08 79%);border:4px solid #27352b;box-shadow:inset 0 0 0 2px rgba(192,167,108,.26),0 8px 18px rgba(0,0,0,.4);position:relative;padding:12px 9px}

    .seat{position:absolute;width:44px;height:25px;border-radius:5px;background:#12251b;border:1px solid rgba(216,227,203,.15);display:flex;align-items:center;justify-content:center;gap:3px;color:#e4e7d9;font-size:7px}
    .seat.one{top:15px;left:50%;transform:translateX(-50%)}
    .seat.two{left:5px;top:95px}.seat.three{right:5px;top:95px}
    .community{display:flex;justify-content:center;gap:3px;margin-top:57px}
    .card{height:43px;width:28px;border-radius:3px;background:#f2f0e8;color:#111b15;box-shadow:0 2px 4px #03130d;font-family:Georgia,serif;font-weight:bold;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
    .card small{font-size:12px;margin-top:3px}
    .red{color:#b83232}

    .chip-row{display:flex;justify-content:center;gap:4px;margin-top:8px}
    .mini-chip{height:18px;width:18px;border-radius:50%;border:3px dashed #e4e2d2;box-shadow:0 2px 3px #06130d}
    .mini-chip:nth-child(1){background:#173e8c}.mini-chip:nth-child(2){background:#bd3437}.mini-chip:nth-child(3){background:#1a6547}
    .controls{display:flex;gap:6px;padding:12px 11px 0}
    .control{flex:1;text-align:center;border:1px solid rgba(207,224,199,.22);padding:9px 2px;border-radius:5px;font-size:7px;color:#d7e4d1;background:#10271c}
    .control.primary{background:#c4e39b;color:#122017;font-weight:800;border-color:#c4e39b}

    .float-chip{position:absolute;width:66px;height:66px;right:-20px;bottom:94px;border-radius:50%;background:repeating-conic-gradient(#d7d9cf 0deg 10deg,#2c754f 10deg 20deg);padding:7px;box-shadow:0 18px 28px rgba(0,0,0,.38);transform:rotate(18deg)}
    .float-chip span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 28%,#1c7650,#082d20 75%);border:1px solid #c7d7b4;color:#e1e6d6;font-family:Georgia,serif;font-size:24px}

    @media(max-width:800px){
      .wrap{width:min(100% - 36px,560px)}header{height:68px}.top-note{font-size:9px}
      .hero{grid-template-columns:1fr;gap:8px;padding:42px 0 38px;min-height:auto}
      .hero-copy{padding:0}.eyebrow{margin-bottom:20px}h1{font-size:clamp(47px,11vw,72px);max-width:560px}
      .benefits{gap:13px}
      .cta-group{grid-template-columns:1fr;gap:12px;max-width:100%}
      .cta{min-height:58px;font-size:12.5px}
      .visual{min-height:500px;margin-top:0}
      .phone{width:250px;height:493px;border-radius:35px}.screen{border-radius:27px}
      .table-area{height:220px;margin-top:12px}.community{margin-top:49px}.card{height:39px;width:25px}
      .float-chip{right:-19px;bottom:80px;width:58px;height:58px}

      .strip-item:first-child{padding-left:0}

    }
    @media(max-width:420px){.wrap{width:calc(100% - 30px)}.top-note{letter-spacing:.08em}.hero{padding-top:43px}h1{font-size:46px}.visual{min-height:460px}.phone{width:230px;height:455px}.table-area{height:203px}.community{margin-top:43px}.card{height:35px;width:23px}.controls{padding-top:10px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.cta{transition:none}}
  </style>
</head>
